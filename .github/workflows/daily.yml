name: daily-gold-dashboard

on:
  schedule:
    - cron: "30 1-9 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 30일 이력을 새로 채우기 (처음 한 번)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Update data (scrape, compute, analyze)
        id: update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python scripts/pipeline.py --backfill
          else
            python scripts/pipeline.py --skip-if-fresh
          fi

      - name: Upload scrape diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "gold-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 갱신"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Send notification (Telegram)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          UPDATED: ${{ steps.update.outputs.updated }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 설정이 없어 알림을 건너뜁니다."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ] && [ "$UPDATED" = "true" ]; then
            MSG=$(printf '✅ 금·은 대시보드가 업데이트됐어요\n%s\nhttps://tedpark76.github.io/gold-dashboard/' "$SUMMARY")
          elif [ "$JOB_STATUS" != "success" ]; then
            MSG=$(printf '⚠️ 금·은 대시보드 업데이트에 실패했어요\n%s' "$RUN_URL")
          else
            echo "이미 갱신돼 있어 알림을 보내지 않습니다."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" > /dev/null
