name: daily-gold-dashboard

on:
  schedule:
    # 한국시간 10:10, 12:10, 13:10, 14:10, 16:10, 18:10 (= UTC 01, 03, 04, 05, 07, 09시 10분).
    # 각 시각의 :10, :25, :40에 세 번 시도합니다. GitHub 예약이 늦거나 빠져도 안전하도록 한 것이고,
    # 이미 갱신했거나 갱신할 시각이 아니면 아무것도 하지 않고 바로 끝납니다.
    - cron: "10,25,40 1,3,4,5,7,9 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 30일 이력을 새로 채우기 (처음 한 번)"
        type: boolean
        default: false
      analysis:
        description: "시장분석도 지금 새로 쓰기"
        type: boolean
        default: false
      mode:
        description: "manual = 지금 바로 갱신 / auto = 정해진 시각에만 갱신"
        type: choice
        options:
          - manual
          - auto
        default: manual

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1단계: 데이터 갱신 + 사이트 묶음(artifact) 업로드
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode || 'manual' }}
      RUN_BACKFILL: ${{ inputs.backfill == true && '--backfill' || '' }}
      RUN_ANALYSIS: ${{ inputs.analysis == true && '--analysis' || '' }}
    outputs:
      run: ${{ steps.gate.outputs.run }}
      updated: ${{ steps.update.outputs.updated }}
      kind: ${{ steps.update.outputs.kind }}
      analysis: ${{ steps.update.outputs.analysis }}
      summary: ${{ steps.update.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to update now
        id: gate
        run: python3 scripts/pipeline.py --check --mode "$RUN_MODE" $RUN_BACKFILL $RUN_ANALYSIS

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Update data (scrape, compute, analyze)
        id: update
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/pipeline.py --mode "$RUN_MODE" $RUN_BACKFILL $RUN_ANALYSIS

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gold-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: update"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - name: Upload site artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site

      - name: Check artifact was uploaded
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f site/index.html && test -f site/app.js && echo "site 파일 확인 완료"
          ls -la site | head -20

  # 2단계: 배포만 따로 (실패하면 이 단계만 다시 실행 가능)
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 3단계: 텔레그램 알림 (앞 단계가 실패해도 항상 실행)
  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send notification (Telegram)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          UPDATED: ${{ needs.build.outputs.updated }}
          KIND: ${{ needs.build.outputs.kind }}
          ANALYSIS: ${{ needs.build.outputs.analysis }}
          SUMMARY: ${{ needs.build.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "텔레그램 설정이 없어 알림을 건너뜁니다."
            exit 0
          fi
          SITE="https://tedpark76.github.io/gold-dashboard/"
          OK=false
          if [ "$BUILD_RESULT" = "success" ] && { [ "$DEPLOY_RESULT" = "success" ] || [ "$DEPLOY_RESULT" = "skipped" ]; }; then
            OK=true
          fi
          if [ "$OK" = "true" ] && [ "$UPDATED" = "true" ]; then
            if [ "$KIND" = "analysis" ]; then
              MSG=$(printf '📝 금·은 시장분석이 업데이트됐어요\n%s' "$SITE")
            else
              NOTE=""
              if [ "$ANALYSIS" = "true" ]; then NOTE=" (시장분석 포함)"; fi
              MSG=$(printf '✅ 금·은 대시보드가 업데이트됐어요%s\n%s\n%s' "$NOTE" "$SUMMARY" "$SITE")
            fi
          elif [ "$OK" != "true" ]; then
            MSG=$(printf '⚠️ 금·은 대시보드 업데이트에 실패했어요\n%s' "$RUN_URL")
          else
            echo "지금은 갱신할 시각이 아니거나 이미 갱신돼 있어 알림을 보내지 않습니다."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" > /dev/null
