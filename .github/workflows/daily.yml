name: daily-gold-dashboard

on:
  schedule:
    - cron: "0 0 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 30일 이력을 새로 채우기 (처음 한 번)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Update data (scrape, compute, analyze)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python scripts/pipeline.py --backfill
          else
            python scripts/pipeline.py
          fi

      - name: Upload scrape diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "gold-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST 갱신"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
